[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "always"
restartPolicyMaxRetries = 10
startCommand = "python scripts/api.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
# Volumen persistente (dashboard Railway → servicio → Volumes): montar p. ej. en /data y poner DATA_DIR=/data
# para conservar logs/*.csv bajo DATA_DIR; strategy_state.json está en /app/data (repo).
