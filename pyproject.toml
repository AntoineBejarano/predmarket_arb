[project]
name = "predmarket-arb"
version = "0.1.0"
description = "Polymarket strategy lab: paper trading, ML edge validation, reproducible experiments"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "lightgbm>=4.0.0",
    # Alinear con la versión usada al serializar calibradores IsotonicRegression en models/saved
    "scikit-learn>=1.6.1,<1.7",
    "scipy>=1.13.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "eth-account>=0.13.0",
    "py-order-utils>=0.3.2",
    "py-clob-client>=0.34.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "joblib>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "websocket-client>=1.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
dev-dependencies = [
    "jupyterlab>=4.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "duckdb>=0.9.0",
]
