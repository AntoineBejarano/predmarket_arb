# Alembic — migraciones Postgres (Supabase / local).
# Uso: export DATABASE_URL=... && alembic upgrade head
# env.py reescribe postgresql:// → postgresql+psycopg:// (psycopg v3, no psycopg2).
# La URL real se toma de DATABASE_URL en env.py (no uses credenciales en este fichero).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Placeholder; env.py usa os.environ["DATABASE_URL"] en runtime.
sqlalchemy.url = postgresql://user:pass@127.0.0.1:5432/postgres

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
